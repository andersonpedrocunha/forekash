<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>404 — Forekash</title>
<meta name="robots" content="noindex"/>
<style>
  :root{ --bg:#0F172A; --surf:#1E293B; --tx:#F8FAFC; --txl:#9CA3AF; --green:#10B981; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);min-height:100vh;display:flex;
       align-items:center;justify-content:center;padding:24px;
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  .w{max-width:30rem;width:100%}
  svg{display:block;margin-bottom:28px}
  .cod{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:.75rem;
       letter-spacing:.14em;color:var(--txl);margin-bottom:10px}
  h1{font-size:1.5rem;font-weight:700;letter-spacing:-.01em;margin-bottom:12px}
  p{color:var(--txl);line-height:1.6;font-size:.9375rem}
  .via{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:.8125rem;
       background:var(--surf);border-radius:8px;padding:10px 12px;margin:20px 0;
       color:var(--tx);overflow-wrap:anywhere;display:none}
  a{display:inline-block;margin-top:8px;color:var(--green);text-decoration:none;
    font-weight:600;font-size:.9375rem}
  a:hover{text-decoration:underline}
  a:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:4px}
</style>
</head>
<body>
  <main class="w">
    <svg width="40" height="40" viewBox="0 0 192 192" aria-hidden="true">
      <rect width="192" height="192" rx="42" fill="#1E293B"/>
      <path d="M53 64 L101 96 L53 128" stroke="#F8FAFC" stroke-width="16"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M96 64 L144 96 L96 128" stroke="#10B981" stroke-width="16"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <div class="cod">ERRO 404</div>
    <h1>Esse caminho não existe</h1>
    <p>Nada responde neste endereço. Se você digitou, confira a grafia; se veio
       de um link, ele está velho.</p>
    <!-- O caminho pedido aparece aqui porque este 404 existe justamente para
         NÃO disfarçar o problema: antes, endereço errado devolvia o app inteiro
         com status 200 e o erro só aparecia depois, deformado. -->
    <div class="via" id="p"></div>
    <a href="/">Voltar ao Forekash</a>
  </main>
  <script>
    try{
      var el = document.getElementById('p');
      // textContent, nunca innerHTML: o caminho vem da URL e é dado de fora.
      el.textContent = location.pathname + location.search;
      el.style.display = 'block';
    }catch(e){}
  </script>
</body>
</html>
