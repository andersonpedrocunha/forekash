# Manifesto do app do Slack — FASE 1
#
# Cole isto em api.slack.com/apps → Create New App → From an app manifest.
# Ele cria o mr kash com os escopos certos, SEM as URLs.
#
# As URLs ficam de fora de propósito: o Slack testa o endereço na hora de
# salvar, e o Worker só consegue responder depois de ter o Signing Secret —
# que só existe depois do app criado. Tentar fazer tudo de uma vez trava
# nesse círculo. Por isso são duas fases (a 2 está no LEIA-ME).

display_information:
  name: mr kash
  description: O analista financeiro do Forekash
  background_color: "#0F172A"
  long_description: |
    mr kash lê os números da TALLER no Forekash e responde sobre eles no Slack.
    Também cuida dos avisos do mês no canal da equipe.
    Não salva, não altera e não apaga nada — do lado do Slack ele só lê.
    Pagamento individual e dívida não saem por aqui.

features:
  bot_user:
    display_name: mr kash
    always_online: true

oauth_config:
  scopes:
    bot:
      - chat:write        # postar os avisos e as respostas
      - app_mentions:read # ouvir quando chamam @mr kash
      - im:history        # ouvir mensagem direta
      - im:read
      - im:write          # conseguir abrir a DM pra responder
      - commands          # o /mrkash

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
